[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/znode-supervisord.pid

[program:zebra]
command=/usr/bin/setpriv --reuid=zebra --regid=zebra --clear-groups /usr/local/bin/zebrad --config /config/zebrad.toml start
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:cloudflared]
command=/usr/bin/setpriv --reuid=zebra --regid=zebra --clear-groups /usr/local/bin/cloudflared tunnel --no-autoupdate run --token-file /run/znode/tunnel-token
autostart=%(ENV_ZNODE_TUNNEL_ENABLED)s
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
