name: Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: |
            ghcr.io/centrexity/znode:latest
            ghcr.io/centrexity/znode:main
            ghcr.io/centrexity/znode:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test node startup and RPC authentication
        run: bash tests/smoke.sh ghcr.io/centrexity/znode:latest
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        run: docker push --all-tags ghcr.io/centrexity/znode
