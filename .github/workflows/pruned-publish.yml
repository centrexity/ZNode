name: Experimental Pruning

on:
  push:
    branches: [feature/pruning]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build patched Zebra and run pruning unit tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.pruned
          load: true
          tags: ghcr.io/centrexity/znode:pruned-experimental
      - name: Verify authentication and restart
        run: bash tests/smoke.sh ghcr.io/centrexity/znode:pruned-experimental
      - name: Verify pruning, mining, UTXOs, and reorganization
        run: bash tests/pruning.sh ghcr.io/centrexity/znode:pruned-experimental
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pruning-results
          path: test-results/
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish experimental image only
        run: docker push ghcr.io/centrexity/znode:pruned-experimental
